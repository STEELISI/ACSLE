# ACSLE ttylog configuration.
# Sourced by start_ttylog.sh (as shell) and read by the `acsle` CLI.
# Keep to plain KEY=VALUE lines: no spaces around '=', no command substitution.

# Where the logging scripts are installed
ACSLE_LIBDIR=/usr/lib/acsle

# Raw session traces: ttylog.<host>.<user>.<N>.trace (+ .err), and count.<user>
TRACE_DIR=/var/log/ttylog

# Per-session command CSVs from analyze_continuous.py: analyze.<user>.<N>.csv
CSV_DIR=/var/log/analyze_cont

# Optional milestone annotation (only used if $MILESTONE_DIR/milestone_file exists)
ANNOTATOR_DIR=/var/log/annotator
MILESTONE_DIR=/var/log/milestones
